<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Milano Terminal</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="noise"></div>

<main class="app">

    <!-- HEADER -->

    <header class="topbar entrance entrance-1">

        <div>
            <div class="airport-code">MXP</div>
            <div class="city-name">MILANO</div>
        </div>

        <div class="terminal-info">
            <span>DIGITAL TERMINAL</span>

            <span class="online">
                <span class="online-dot"></span>
                ONLINE
            </span>
        </div>

    </header>


    <!-- TITLE -->

    <section class="hero">

        <div class="service-label entrance entrance-2">
            SERVICE STATUS
        </div>

    </section>


    <!-- BOARD -->

    <section class="board">


        <!-- GMAIL -->

        <div
            class="board-row entrance entrance-3"
            id="gmailRow"
            role="button"
            tabindex="0"
        >

            <div class="row-number">
                01
            </div>

            <div class="row-info">

                <div class="row-title">
                    GMAIL
                </div>

                <div class="row-subtitle">
                    MAIL SERVICE
                </div>

            </div>


            <button
                class="action-button"
                id="gmailAction"
                type="button"
            >
                <span>OPEN</span>

                <span class="action-arrow">
                    →
                </span>
            </button>

        </div>



        <!-- TIME -->

        <div
            class="board-row entrance entrance-4"
            id="timeRow"
            role="button"
            tabindex="0"
        >

            <div class="row-number">
                02
            </div>

            <div class="row-info">

                <div class="row-title">
                    MILANO TIME
                </div>

                <div class="row-subtitle">
                    LOCAL CLOCK
                </div>

            </div>


            <button
                class="action-button"
                id="timeAction"
                type="button"
            >
                <span>LIVE</span>

                <span class="action-arrow">
                    →
                </span>
            </button>

        </div>



        <!-- THIRD -->

        <div
            class="board-row disabled-row entrance entrance-5"
        >

            <div class="row-number">
                03
            </div>

            <div class="row-info">

                <div class="row-title">
                    GATE 03
                </div>

                <div class="row-subtitle">
                    NOT ASSIGNED
                </div>

            </div>


            <div class="standby">
                STANDBY
            </div>

        </div>

    </section>



    <!-- FOOTER -->

    <footer class="footer entrance entrance-6">

        <div>
            TERMINAL / 01
        </div>

        <div class="footer-city">
            MILANO
        </div>

        <div class="footer-time" id="footerTime">
            --:--
        </div>

    </footer>

</main>



<!-- ============================= -->
<!-- TIME SCREEN -->
<!-- ============================= -->

<section
    class="time-screen"
    id="timeScreen"
>

    <div class="time-noise"></div>


    <div class="giant-city">
        MILANO
    </div>


    <header class="time-header">

        <button
            class="back-button"
            id="closeTime"
            type="button"
        >
            <span>←</span>
            BACK
        </button>


        <div class="time-header-right">
            MXP / LOCAL TIME
        </div>

    </header>



    <div class="clock-wrapper">

        <div class="clock-label">
            CURRENT LOCAL TIME
        </div>


        <div class="clock-line">

            <div
                class="clock"
                id="clock"
            >
                00:00
            </div>

            <div
                class="seconds"
                id="seconds"
            >
                00
            </div>

        </div>


        <div class="clock-divider"></div>


        <div class="clock-bottom">

            <div class="clock-city">
                MILANO
            </div>

            <div
                class="clock-date"
                id="clockDate"
            >
                —
            </div>

        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
