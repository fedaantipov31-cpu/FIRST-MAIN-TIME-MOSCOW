<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Milano Terminal</title>

    <!-- v=10 нужен, чтобы браузер точно не взял старый CSS -->
    <link rel="stylesheet" href="style.css?v=10">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div class="grain"></div>


<main class="terminal-app">


    <!-- ========================= -->
    <!-- ВЕРХНИЙ БЛОК -->
    <!-- ========================= -->

    <header class="airport-header">

        <div class="header-line slide-line delay-1">
            MXP
        </div>

        <div class="header-line slide-line delay-2">
            MILANO
        </div>

        <div class="header-line slide-line delay-3">
            DIGITAL TERMINAL
        </div>

        <div class="header-line slide-line delay-4">
            ONLINE
        </div>

        <div class="header-line service slide-line delay-5">
            SERVICE STATUS
        </div>

    </header>



    <!-- ========================= -->
    <!-- ТАБЛО -->
    <!-- ========================= -->

    <section class="board">


        <!-- GMAIL -->

        <div class="board-row row-enter delay-row-1">

            <div class="number">
                01
            </div>


            <div class="row-text">

                <div class="row-title">
                    GMAIL
                </div>

                <div class="row-subtitle">
                    MAIL SERVICE
                </div>

            </div>


            <button
                class="terminal-button"
                id="gmailButton"
                type="button"
            >

                <span class="button-fill"></span>

                <span class="button-text">
                    OPEN MAIL
                </span>

            </button>

        </div>



        <!-- MILANO TIME -->

        <div class="board-row row-enter delay-row-2">

            <div class="number">
                02
            </div>


            <div class="row-text">

                <div class="row-title">
                    MILANO TIME
                </div>

                <div class="row-subtitle">
                    LOCAL CLOCK
                </div>

            </div>


            <button
                class="terminal-button"
                id="timeButton"
                type="button"
            >

                <span class="button-fill"></span>

                <span class="button-text">
                    OPEN CLOCK
                </span>

            </button>

        </div>



        <!-- GATE 03 -->

        <div class="board-row row-enter delay-row-3">

            <div class="number">
                03
            </div>


            <div class="row-text">

                <div class="row-title">
                    GATE 03
                </div>

                <div class="row-subtitle">
                    NOT ASSIGNED
                </div>

            </div>


            <button
                class="terminal-button disabled-button"
                type="button"
                disabled
            >

                <span class="button-text dots">
                    • • •
                </span>

            </button>

        </div>


    </section>



    <!-- ========================= -->
    <!-- НИЖНИЙ БЛОК -->
    <!-- ========================= -->

    <footer class="airport-footer">

        <div class="footer-line slide-line footer-delay-1">
            TERMINAL / 01
        </div>

        <div class="footer-line slide-line footer-delay-2">
            MILANO
        </div>

        <div
            class="footer-time slide-line footer-delay-3"
            id="footerTime"
        >
            --:--
        </div>

    </footer>


</main>



<!-- ===================================================== -->
<!-- ЭКРАН ВРЕМЕНИ -->
<!-- ===================================================== -->

<section
    class="time-screen"
    id="timeScreen"
>


    <div class="time-grain"></div>


    <div class="background-milano">
        MILANO
    </div>


    <div class="time-top">

        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            BACK
        </button>


        <div class="time-code">
            MXP / LOCAL
        </div>

    </div>



    <div class="clock-area">

        <div class="clock-label">
            MILANO LOCAL TIME
        </div>


        <div class="clock-row">

            <div
                class="clock"
                id="clock"
            >
                00:00
            </div>


            <div
                class="seconds"
                id="seconds"
            >
                00
            </div>

        </div>


        <div class="clock-line-divider"></div>


        <div class="clock-bottom">

            <div class="clock-city">
                MILANO
            </div>

            <div
                class="clock-date"
                id="clockDate"
            >
                —
            </div>

        </div>

    </div>


</section>



<script src="script.js?v=10"></script>


</body>

</html>
