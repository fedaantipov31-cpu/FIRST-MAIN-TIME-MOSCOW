<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Milano Terminal</title>

    <!-- ВАЖНО: правильное подключение CSS -->
    <link rel="stylesheet" href="./style.css?v=13">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="grain"></div>

<main class="terminal-app">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="airport-header">

        <div class="header-line slide-in" style="--delay: .05s">
            MXP
        </div>

        <div class="header-line slide-in" style="--delay: .14s">
            MILANO
        </div>

        <div class="header-line slide-in" style="--delay: .23s">
            DIGITAL TERMINAL
        </div>

        <div class="header-line slide-in" style="--delay: .32s">
            ONLINE
        </div>

        <div class="header-line service slide-in" style="--delay: .41s">
            SERVICE STATUS
        </div>

    </header>


    <!-- ========================= -->
    <!-- BOARD -->
    <!-- ========================= -->

    <section class="board">

        <!-- GMAIL -->

        <div class="board-row">

            <div
                class="number slide-in"
                style="--delay: .58s"
            >
                01
            </div>

            <div
                class="row-text slide-in"
                style="--delay: .64s"
            >
                <div class="row-title">
                    GMAIL
                </div>

                <div class="row-subtitle">
                    MAIL SERVICE
                </div>
            </div>

            <button
                class="terminal-button button-enter"
                id="gmailButton"
                type="button"
                style="--delay: .70s"
            >
                <span class="button-fill"></span>

                <span class="button-text">
                    OPEN MAIL
                </span>
            </button>

        </div>


        <!-- CLOCK -->

        <div class="board-row">

            <div
                class="number slide-in"
                style="--delay: .82s"
            >
                02
            </div>

            <div
                class="row-text slide-in"
                style="--delay: .88s"
            >
                <div class="row-title">
                    MILANO TIME
                </div>

                <div class="row-subtitle">
                    LOCAL CLOCK
                </div>
            </div>

            <button
                class="terminal-button button-enter"
                id="timeButton"
                type="button"
                style="--delay: .94s"
            >
                <span class="button-fill"></span>

                <span class="button-text">
                    OPEN CLOCK
                </span>
            </button>

        </div>


        <!-- THIRD -->

        <div class="board-row">

            <div
                class="number slide-in"
                style="--delay: 1.06s"
            >
                03
            </div>

            <div
                class="row-text slide-in"
                style="--delay: 1.12s"
            >
                <div class="row-title">
                    GATE 03
                </div>

                <div class="row-subtitle">
                    NOT ASSIGNED
                </div>
            </div>

            <button
                class="terminal-button disabled-button button-enter"
                type="button"
                disabled
                style="--delay: 1.18s"
            >
                <span class="dots">
                    • • •
                </span>
            </button>

        </div>

    </section>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="airport-footer">

        <div
            class="footer-line slide-in"
            style="--delay: 1.30s"
        >
            TERMINAL / 01
        </div>

        <div
            class="footer-line slide-in"
            style="--delay: 1.39s"
        >
            MILANO
        </div>

        <div
            class="footer-time slide-in"
            id="footerTime"
            style="--delay: 1.48s"
        >
            --:--
        </div>

    </footer>

</main>


<!-- ================================================= -->
<!-- CLOCK SCREEN -->
<!-- ================================================= -->

<section
    class="time-screen"
    id="timeScreen"
>

    <div class="time-grain"></div>

    <div class="background-milano">
        MILANO
    </div>


    <header class="time-top">

        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            BACK
        </button>

        <div class="time-code">
            MXP / LOCAL
        </div>

    </header>


    <div class="clock-area">

        <div class="clock-label">
            MILANO LOCAL TIME
        </div>

        <div class="clock-row">

            <div
                class="clock"
                id="clock"
            >
                00:00
            </div>

            <div
                class="seconds"
                id="seconds"
            >
                00
            </div>

        </div>

        <div class="clock-divider"></div>

        <div class="clock-bottom">

            <div class="clock-city">
                MILANO
            </div>

            <div
                class="clock-date"
                id="clockDate"
            >
                —
            </div>

        </div>

    </div>

</section>


<!-- ВАЖНО: правильное подключение JS -->
<script src="./script.js?v=13"></script>

</body>
</html>
